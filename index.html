<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="preload" href="/resources/Angel-sealingGlyphs-Regular.woff2" as="font" type="font/woff2" crossorigin>

  <title>DishBoard</title>
  <link rel="icon" type="image/svg+xml" href="/resources/logo.svg">
  <meta name="description" content="Social media for sharing recipes">
  
  <!-- Set the initial theme inline to attempt to prevent flashing -->
  <script nonce="#script-nonce#">
    if ( { true: true, false: false }[ localStorage.getItem( 'dark' ) ]
      ?? window.matchMedia( '(prefers-color-scheme: dark)' ).matches )
      document.lastChild.classList.add( 'dark' );
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=DM+Serif+Display&family=Roboto&display=swap');

    @font-face {
      font-family: 'Angel-sealing Glyphs';
      src: url('/resources/Angel-sealingGlyphs-Regular.woff2');
      font-display: swap;
    }

    /* -- Variables -- */
    :root {
      /* background colours */
      --bg-primary: #fff;
      --bg-secondary: #bbb;
      --by-tertiary: #88a;

      /* foreground colours */
      --fg-primary: #aaa;
      --fg-secondary: #bbb;
      --fg-tertiary: #99d;
      --fg-error: #f88;

      /* text colours */
      --text-primary: #000;
      --text-secondary: #888;
      --text-tertiary: #88e;
      --text-error: #f88;
    }

    :root.dark {
      /* background colours */
      --bg-primary: #222;
      --bg-secondary: #333;
      --by-tertiary: #88a;

      /* foreground colours */
      --fg-primary: #444;
      --fg-secondary: #333;
      --fg-tertiary: #77b;
      --fg-error: #a66;

      /* text colours */
      --text-primary: #eee;
      --text-secondary: #8a8a8a;
      --text-tertiary: #99f;
      --text-error: #f88;
    }

    /* -- Top level styling -- */

    /* Disable defaults */
    * {
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      font-family: Roboto, sans-serif;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      scrollbar-gutter: stable;

      /* Add colour transitions for everything */
      transition: color 0.25s, background-color 0.5s;
    }

    .hidden {
      display: none;
    }

    /* -- Logo -- */
    #logo {
      position: fixed;
      top: 1rem;
      left: 1rem;
      width: 6rem;
      height: 6rem;
    }

    /* -- Dark mode selector -- */
    #dm-selector {
      position: fixed;
      top: 10px;
      right: 20px;
      font-size: 2rem;
      text-shadow: 0.2rem 0.2rem 0.2rem var(--fg-secondary);
      cursor: pointer;
      user-select: none;
    }

    /* -- Container -- */
    body {
      margin: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      row-gap: 20px;
    }

    /* -- Navbar -- */
    header {
      display: contents;
    }

    nav {
      margin: 0 4rem;
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-evenly;
      align-items: center;
      gap: 0.8rem 5rem;
      font-family: Comfortaa, sans-serif;
      color: var(--text-secondary);
      border: solid var(--fg-primary);
      border-radius: 30px;
    }

    nav > * {
      display: flex;
      font-size: 2rem;
      border-radius: 20%;
      cursor: pointer;
      user-select: none;
      transition: color 0.5s;
    }

    nav > .active {
      color: var(--text-primary);
    }

    nav > :not( .active ):hover {
      color: var(--text-tertiary);
    }

    /* -- Content container -- */
    main {
      width: 60%;
      min-height: 50vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      border: solid var(--fg-primary);
      border-radius: 40px;
      overflow: hidden;
    }

    main > div {
      padding: 1rem;
      width: calc(100% - 2rem);
    }

    main > div.no-border {
      padding: 1rem 1rem 0;
    }

    main > div:not( :last-child, .no-border ) {
      border-bottom: solid var(--fg-primary);
    }

    /* -- Forms -- */
    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    label {
      font-size: 1.25rem;
    }

    label > input,
    label > textarea {
      display: block;
      margin-top: 0.4rem;
    }

    input,
    textarea {
      background-color: transparent;
    }

    input[ type = 'text' ],
    textarea {
      padding: 0.4rem;
      border: solid var(--fg-secondary);
      border-radius: 10px;
      font-size: 1rem;
      color: inherit;
      transition: border-color 0.25s;
    }

    input[ type = 'text' ]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--fg-tertiary);
    }

    input[ type = 'text' ].invalid,
    textarea.invalid {
      border-color: var(--fg-error);
    }

    input[ type = 'checkbox' ] {
      appearance: none;
      display: flex;
      width: 2rem;
      height: 2rem;
      margin: 0;
      border: solid var(--fg-primary);
      border-radius: 0.5rem;
      align-items: center;
      cursor: pointer;
    }

    input[ type = 'checkbox' ]::after {
      content: '';
      position: relative;
      width: 0.6rem;
      height: 1.8rem;
      border-bottom: 5px solid transparent;
      border-right: 5px solid transparent;
      border-radius: 0.2rem;
      transform: translate(80%, -25%) rotate(45deg);
      transition: border-color 0.1s;
    }

    input[ type = 'checkbox' ]:checked::after {
      border-color: var(--fg-tertiary);
    }

    label:has( input[ type = 'checkbox' ] ) {
      display: contents;
    }

    input[ type = 'color' ] {
      width: 4rem;
      height: 2rem;
      border: none;
    }

    input:is( [ type = 'submit' ], [ type = 'button' ] ) {
      padding: 0.6rem;
      border: solid var(--fg-secondary);
      border-radius: 20px;
      color: inherit;
      font-size: inherit;
      cursor: pointer;
      transition: color 0.25s;
    }

    input:is( [ type = 'submit' ], [ type = 'button' ] ):hover {
      color: var(--text-tertiary);
    }

    .error {
      font-size: 1.25rem;
      color: var(--text-error);
    }

    /* -- Profile -- */
    nav > [ data-page-id = 'profile' ] {
      display: flex;
      gap: 0.2rem;
      align-items: center;
      padding: 0.6rem 0.8rem;
      border: solid var(--fg-secondary);
      border-radius: 20px;
      font-size: 1.5rem;
    }

    nav > [ data-page-id = 'profile' ]::before {
      content: attr(data-user-glyph);
      font-family: 'Angel-sealing Glyphs';
      font-size: 4rem;
      color: var(--glyph-colour);
    }

    nav > [ data-page-id = 'profile' ]::after {
      content: attr(data-user-username);
      font-family: Roboto, sans-serif;
      transition: color 0.25s;
    }

    label:has( .sign-up-glyph ) {
      display: contents;
    }

    .sign-up-glyph-input {
      display: flex;
      gap: 0.8rem;
      font-family: Comfortaa, sans-serif;
      font-size: 6rem;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    /* Extra selectors to increase specificity */
    input[ type = 'text' ].sign-up-glyph {
      width: 6.8rem;
      border: none;
      font-family: 'Angel-sealing Glyphs';
      font-size: 8rem;
      cursor: default;
    }

    .profile {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .profile > span {
      padding: 0.8rem;
      border: solid var(--fg-secondary);
      border-radius: 0.8rem;
      cursor: pointer;
    }

    .profile > span:hover {
      color: var(--text-tertiary);
      transition: color 0.25s;
    }

    /* -- Search -- */
    .search {
      flex-direction: row;
      justify-content: center;
    }

    /* -- Post -- */
    .post {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0.8rem;
    }

    .post-user {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-right: 0.8rem;
      border-right: solid var(--fg-secondary);
      cursor: pointer;
    }

    .post.no-user > .post-user {
      display: none;
    }

    .post-user::before {
      content: attr(data-user-glyph);
      font-family: 'Angel-sealing Glyphs';
      font-size: 4rem;
      color: var(--glyph-colour);
    }

    .post-user::after {
      content: '@' attr(data-user-username);
      transition: color 0.25s;
    }

    .post-user:hover::after {
      color: var(--text-tertiary);
    }

    .post-recipe {
      font-size: 0.8rem;
      overflow-wrap: break-word;
      inline-size: 30%;
      list-style-position: inside;
    }

    .post.no-user > .post-recipe {
      inline-size: 40%;
    }

    .post-recipe > ::marker {
      color: var(--text-secondary);
    }

    .post-body {
      padding-left: 0.8rem;
      border-left: solid var(--fg-secondary);
      overflow-wrap: break-word;
      inline-size: 40%;
    }

    .post.no-user > .post-body {
      inline-size: 50%;
    }

    .post-body::before {
      content: attr(data-datetime);
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* -- New Post -- */
    .post-new-recipe li {
      align-items: center;
      list-style-position: inside;
    }

    .post-new-recipe input[ type = 'text' ] {
      display: inline;
    }

    .post-new-recipe input[ type = 'button' ] {
      height: 2rem;
      padding-top: 0;
      padding-bottom: 0;
    }

    /* -- User -- */
    .user {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      column-gap: 0.8rem;
    }

    .user * {
      transition: color 0.25s;
    }

    .user::before {
      content: attr(data-user-glyph);
      font-family: 'Angel-sealing Glyphs';
      font-size: 8rem;
      user-select: none;
      text-align: center;
      color: var(--glyph-colour);
    }

    .user-info {
      display: flex;
      width: 80%;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      row-gap: 0.8rem;
    }

    .user-username {
      font-size: 2rem;
      text-align: center;
      cursor: pointer;
    }

    .user-username:hover {
      color: var(--text-tertiary);
    }

    .user-figures {
      display: flex;
      justify-content: space-evenly;
      font-size: 1.5rem;
      color: var(--text-secondary);
    }

    .user-figures > * {
      cursor: pointer;
    }

    .user-figures > *:hover {
      color: var(--text-tertiary);
    }

    /* -- Thin desktop changes -- */
    @media ( orientation: landscape ) and ( max-width: 64rem ) {
      #logo {
        position: absolute;
        width: 5rem;
        height: 5rem;
      }

      main {
        width: 80%;
      }
    }

    /* -- Mobile changes */
    @media ( orientation: portrait ) {
      #logo,
      #dm-selector {
        position: absolute;
      }

      #logo {
        position: relative;
        top: 0;
        left: 0;
      }

      main {
        width: 80%;
      }

      nav > [ data-page-id = 'profile' ] {
        flex-direction: column;
        padding: 0.8rem;
      }

      .search {
        flex-direction: column;
      }

      .post {
        flex-direction: column;
      }

      .post-user {
        flex-direction: row;
        padding-right: 0;
        padding-bottom: 0.8rem;
        column-gap: 0.8rem;
        border-right: none;
        border-bottom: solid var(--fg-secondary);
        font-size: 1.5rem;
      }

      .post-recipe,
      .post.no-user > .post-recipe {
        inline-size: 100%;
      }

      .post-body,
      .post.no-user > .post-body {
        padding-left: 0;
        padding-top: 0.8rem;
        border-left: none;
        border-top: solid var(--fg-secondary);
        inline-size: 100%;
      }

      .user {
        flex-direction: column;
      }

      .user-info {
        display: contents;
      }
    }
  </style>

  <script src="/resources/index.js" type="module"></script>
</head>

<body>
  <template id="Login">
    <form action="javascript:void(0);">
      <label>
        Username:
        <input type="text" name="username" spellcheck="false">
      </label>

      <input type="submit" value="Login" data-login-action="login">
      <input type="submit" value="Sign Up" data-login-action="signUp">

      <span class="error"></span>
    </form>
  </template>

  <template id="SignUp">
    <form action="javascript:void(0);">
      <label>
        Username:
        <input type="text" name="username" spellcheck="false">
      </label>

      <label>
        Glyph:
        <div class="sign-up-glyph-input">
          <span class="sign-up-glyph-last" tabindex="0" role="button">&lt;</span>
          <input type="text" name="glyph" class="sign-up-glyph" readonly tabindex="-1">
          <span class="sign-up-glyph-next" tabindex="0" role="button">&gt;</span>
        </div>
      </label>

      <label>
        Colour:
        <input type="color" name="colour">
      </label>

      <input type="submit" value="Sign up">

      <span class="error"></span>
    </form>
  </template>

  <template id="Profile">
    <div class="profile">
      <span data-action="edit" tabindex="0" role="link">Edit profile</span>
      <span data-action="new-post" tabindex="0" role="link">New post</span>
      <span data-action="logout" tabindex="0" role="link">Logout</span>
    </div>
  </template>

  <template id="Post">
    <div class="post">
      <span class="post-user" tabindex="0" role="link"></span>
      <ol class="post-recipe"></ol>
      <span class="post-body"></span>
    </div>
  </template>

  <template id="PostNew">
    <form action="javascript:void(0);">
      <label>
        Recipe:
        <ol class="post-new-recipe"></ol>
      </label>
      <input type="button" value="+ Step">
      
      <label>
        Body:
        <textarea name="body" cols="30" rows="10"></textarea>
      </label>

      <input type="submit" value="Post">

      <span class="error"></span>
    </form>
  </template>

  <template id="PostNewInstruction">
    <li>
      <label>
        <input type="text" name="recipe">
      </label>
      <input type="button" value="&uarr;" data-action="up">
      <input type="button" value="-" data-action="delete">
      <input type="button" value="&darr;" data-action="down">
    </li>
  </template>

  <template id="User">
    <div class="user">
      <span class="user-info">
        <span class="user-username" tabindex="0" role="link"></span>
        <span class="user-figures">
          <span class="user-nposts" tabindex="0" role="link"></span>
          <span class="user-nfollowing" tabindex="0" role="link"></span>
        </span>
      </span>
    </div>
  </template>

  <template id="Search">
    <form class="search" action="javascript:void(0);">
      <input type="text" name="query" placeholder="Query" aria-label="Search query">
      <input type="submit" value="Search">
    </form> 
  </template>

  <header>
    <object id="logo" data="/resources/logo.svg" type="image/svg+xml" role="img" aria-label="The logo with the letters DB in the middle of a minimalist line drawing of a plate.">
      The logo with the letters DB in the middle of a minimalist line drawing of a plate.
    </object>
    <span id="dm-selector" tabindex="0" role="button">🌑</span>
    <nav>
      <span data-page-id="feed" class="hidden" tabindex="0" role="link" aria-hidden="true">Feed</span>
      <span data-page-id="posts" class="active" tabindex="0" role="link">Posts</span>
      <span data-page-id="users" tabindex="0" role="link">Users</span>
      <span data-page-id="profile" tabindex="0" role="link">Login</span>
    </nav>
  </header>

  <main>
  </main>

  <span id="End"></span>
</body>

</html>
